<footer class="site-footer">
  <div class="wrap">
    <p class="footer-copy">&copy; {{ site.time | date: '%Y' }} {{ site.author | default: site.title }}. All rights reserved.</p>
    <div class="footer-links">
      {% if site.minima.social_links.github %}
        <a href="https://github.com/{{ site.minima.social_links.github }}" target="_blank" rel="noopener noreferrer">GitHub</a>
      {% endif %}
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
  </div>
</footer>
